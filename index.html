<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>新・花の百名山</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/map.css">
</head>

<body>
  <main class="page">
    <section class="title-area">
      <div class="kicker">FIELD NOTES / PHOTOS / SOUND</div>

      <h1>新・花の百名山</h1>

      <p class="subtitle">
        <span class="subtitle-en">Field Notes of Japan's New 100 Flower Mountains</span>
        音・写真・花のフィールドノート
      </p>

      <div class="progress">
        <span id="visited-count">1</span> <span>/ 100</span>
      </div>
      <p class="record-count" id="record-count"></p>

      <nav class="explore" aria-label="アーカイブを辿る">
        <div class="explore-title">EXPLORE BY</div>

        <div class="explore-links">
          <a href="archive/sound.html">音で辿る</a>
          <a href="archive/photos.html">写真で辿る</a>
          <a href="archive/flowers.html">花で辿る</a>
          <a href="archive/regions.html">地域で辿る</a>
          <a href="archive/memories.html">思い出で辿る</a>
          <a href="archive/seasons.html">季節で辿る</a>
        </div>
      </nav>
    </section>

    <section class="map-area" aria-label="新・花の百名山 地図">
      <div class="map-toolbar">
        <div>
          <div class="season-filter-title">FILTER BY SEASON</div>
          <div class="filter-buttons" aria-label="地図を絞り込む">
            <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">ALL</button>
            <button class="filter-button" type="button" data-filter="spring" aria-pressed="false">春</button>
            <button class="filter-button" type="button" data-filter="summer" aria-pressed="false">夏</button>
            <button class="filter-button" type="button" data-filter="autumn" aria-pressed="false">秋</button>
            <button class="filter-button" type="button" data-filter="winter" aria-pressed="false">冬</button>
            <button class="filter-button" type="button" data-filter="visited" aria-pressed="false">訪問済み</button>
          </div>
        </div>
        <button id="reset-map" type="button">日本全体に戻る ↗</button>
      </div>
      <div id="japan-map" aria-label="ドラッグと拡大縮小で辿れる日本地図"></div>
      <div class="map-help">
        <span><strong>●</strong> 訪問済み</span><span>● 未訪問</span><span><strong>◆</strong> 100選外の記録地</span>
        <span>＋／−で拡大縮小・ドラッグで移動・ピンを押すと詳細</span>
      </div>
      <p id="map-status" role="status" aria-live="polite"></p>
      <div class="map-bottom">
        <details class="record-menu">
          <summary>PLACE RECORDS / 5</summary>
          <nav id="record-list" aria-label="場所の記録"></nav>
        </details>
        <details class="record-menu" id="pending-places">
          <summary id="pending-summary">位置の確認中</summary>
          <p>範囲の広い名称など、表示する地点を確認している記録です。</p>
          <ul id="pending-list"></ul>
        </details>
      </div>
      <noscript><p>地図の表示にはJavaScriptを有効にしてください。<a href="archive/regions.html">地域の記録はこちら →</a></p></noscript>
    </section>
  </main>

  <script src="assets/vendor/leaflet/leaflet.js"></script>
  <script src="data/japan-geography.js"></script>
  <script src="data/mountains.js"></script>
  <script src="data/map-locations.js"></script>
  <script src="assets/archive-map.js"></script>
<script src="data/image-catalog.js"></script>
<script src="data/image-settings.js"></script>
<script src="assets/image-settings.js"></script>
</body>
</html>
