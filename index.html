<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新・花の百名山</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070907;
      --text: #f4efe4;
      --muted: rgba(244,239,228,.66);
      --gold: #d4b56a;
      --line: rgba(244,239,228,.16);
      --panel: rgba(7,12,8,.84);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.88)),
        url("assets/background-autumn.png") center / cover fixed;
      color: var(--text);
      font-family: "IBM Plex Sans JP", sans-serif;
      overflow: hidden;
    }

    .page {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-columns: 28% 72%;
      align-items: center;
      gap: 24px;
      padding: 72px 72px 72px 84px;
    }

    .title-area {
      z-index: 2;
      align-self: start;
      padding-top: 1vh;
      max-width: 360px;
    }

    .kicker {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .26em;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3.2vw, 46px);
      font-weight: 600;
      letter-spacing: .12em;
      white-space: nowrap;
    }

    .subtitle {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.75;
      color: var(--muted);
      letter-spacing: .04em;
    }

    .subtitle-en {
      display: block;
      color: var(--text);
      font-size: clamp(10px, .82vw, 12px);
      margin-bottom: 8px;
      white-space: nowrap;
      letter-spacing: .01em;
    }

    .progress {
      margin-top: 26px;
      font-size: 50px;
      font-weight: 300;
      line-height: 1;
    }

    .progress span {
      font-size: 18px;
      color: rgba(244,239,228,.5);
    }

    .explore {
      margin-top: 30px;
      max-width: 340px;
      padding-bottom: 40px;
    }

    .explore-title {
      color: var(--gold);
      font-size: 11px;
      letter-spacing: .22em;
      margin-bottom: 12px;
    }

    .explore-links {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
    }

    .explore-links a {
      position: relative;
      display: grid;
      grid-template-columns: 22px 1fr 16px;
      align-items: center;
      min-height: 34px;
      padding: 5px 0 7px;
      border-bottom: 1px solid rgba(244,239,228,.13);
      color: rgba(244,239,228,.82);
      text-decoration: none;
      font-size: 14px;
      letter-spacing: .08em;
      transition: color .25s ease, padding-left .25s ease;
    }

    .explore-links a::before {
      content: "";
      width: 16px;
      height: 16px;
      border: 1px solid rgba(212,181,106,.55);
      border-radius: 50%;
      opacity: .82;
    }

    .explore-links a::after {
      content: "→";
      color: rgba(212,181,106,.72);
      font-size: 12px;
      justify-self: end;
      transition: transform .25s ease;
    }

    .explore-links a:hover {
      color: var(--gold);
      padding-left: 8px;
    }

    .explore-links a:hover::after {
      transform: translateX(4px);
    }

    .map-area {
      position: relative;
      width: min(72vw, 1120px);
      margin-left: auto;
      margin-right: 0;
      transform: translate(-24px, -8px);
    }

    .map-area img {
      width: 100%;
      display: block;
      filter: invert(1) brightness(1.35) opacity(.72);
      pointer-events: none;
    }

    .map-pins {
      position: absolute;
      inset: 0;
      z-index: 3;
    }

    .map-controls {
      position: absolute;
      left: 63%;
      top: 55%;
      z-index: 8;
      width: 340px;
      max-width: 38vw;
      padding: 0;
      background: transparent;
      border: none;
      backdrop-filter: none;
    }

    .season-filter-title {
      display: inline-block;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .22em;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(212,181,106,.42);
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
    }

    .filter-button {
      appearance: none;
      border: none;
      border-bottom: 1px solid rgba(244,239,228,.24);
      background: transparent;
      color: rgba(244,239,228,.66);
      padding: 4px 0 5px;
      border-radius: 0;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: .12em;
      cursor: pointer;
      transition:
        color .2s ease,
        border-color .2s ease,
        transform .2s ease;
    }

    .filter-button:hover {
      color: var(--gold);
      border-color: rgba(212,181,106,.58);
      transform: translateY(-1px);
    }

    .filter-button.active {
      color: var(--gold);
      background: transparent;
      border-color: var(--gold);
    }

    .filter-note {
      margin-top: 12px;
      color: rgba(244,239,228,.42);
      font-size: 10px;
      line-height: 1.65;
      letter-spacing: .04em;
      white-space: normal;
    }

    .pin {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: rgba(244,239,228,.32);
      border: 1px solid rgba(244,239,228,.38);
      cursor: pointer;
      transition:
        opacity .2s ease,
        transform .2s ease,
        background .2s ease,
        box-shadow .2s ease;
    }

    .pin:hover {
      transform: translate(-50%, -50%) scale(1.7);
      z-index: 6;
    }

    .pin.visited {
      width: 12px;
      height: 12px;
      background: var(--gold);
      border: none;
      box-shadow:
        0 0 0 5px rgba(212,181,106,.15),
        0 0 22px rgba(212,181,106,.85);
      z-index: 5;
    }

    .pin.visited::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px solid rgba(212,181,106,.45);
      animation: pulse 2.2s infinite;
    }

    .pin.best-season {
      width: 9px;
      height: 9px;
      background: var(--gold);
      border-color: var(--gold);
      box-shadow:
        0 0 0 4px rgba(212,181,106,.12),
        0 0 16px rgba(212,181,106,.62);
    }

    .pin.good-season {
      background: rgba(212,181,106,.45);
      border-color: rgba(212,181,106,.65);
    }

    .pin.hidden {
      opacity: .06;
      pointer-events: none;
    }

    @keyframes pulse {
      0% {
        transform: scale(.55);
        opacity: 1;
      }

      100% {
        transform: scale(1.8);
        opacity: 0;
      }
    }

    .place-card {
      position: absolute;
      left: 56%;
      top: 49%;
      width: 280px;
      padding: 20px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.15);
      backdrop-filter: blur(18px);
      box-shadow: 0 30px 80px rgba(0,0,0,.45);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: .25s ease;
      z-index: 9;
    }

    .place-card.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .place-card .card-label {
      margin-bottom: 8px;
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .2em;
    }

    .place-card h2 {
      margin: 0 0 8px;
      font-size: 21px;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .place-card p {
      margin: 6px 0;
      color: rgba(244,239,228,.72);
      font-size: 13px;
      line-height: 1.55;
    }

    .place-card a {
      display: inline-block;
      margin-top: 14px;
      color: var(--gold);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: .12em;
    }

    .legend {
      position: fixed;
      right: 54px;
      bottom: 38px;
      display: flex;
      gap: 18px;
      font-size: 11px;
      letter-spacing: .12em;
      color: rgba(244,239,228,.6);
      z-index: 10;
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 8px;
      border-radius: 50%;
      background: rgba(244,239,228,.35);
    }

    .legend .visited::before {
      background: var(--gold);
      box-shadow: 0 0 12px rgba(212,181,106,.9);
    }

    @media (max-width: 1200px) {
      .page {
        grid-template-columns: 30% 70%;
        padding: 54px 54px 54px 64px;
      }

      .title-area {
        padding-top: 0;
      }

      .explore {
        margin-top: 24px;
        padding-bottom: 48px;
      }

      .explore-links {
        gap: 3px;
      }

      .explore-links a {
        min-height: 32px;
        padding: 4px 0 6px;
        font-size: 13px;
      }

      .progress {
        margin-top: 22px;
        font-size: 48px;
      }
    }

    @media (max-width: 900px) {
      body {
        height: auto;
        overflow-y: auto;
      }

      .page {
        height: auto;
        min-height: 100vh;
        grid-template-columns: 1fr;
        padding: 32px 22px 110px;
      }

      .title-area {
        padding-top: 0;
        max-width: none;
      }

      h1 {
        white-space: normal;
      }

      .subtitle-en {
        white-space: normal;
      }

      .map-area {
        width: 100%;
        transform: none;
      }

      .map-controls {
        position: relative;
        left: auto;
        top: auto;
        width: 100%;
        max-width: none;
        margin-bottom: 18px;
      }

      .legend {
        right: 22px;
        bottom: 30px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section class="title-area">
      <div class="kicker">FIELD NOTES / PHOTOS / SOUND</div>

      <h1>新・花の百名山</h1>

      <p class="subtitle">
        <span class="subtitle-en">Field Notes of Japan's New 100 Flower Mountains</span>
        音・写真・花のフィールドノート
      </p>

      <div class="progress">
        <span id="visited-count">1</span> <span>/ 100</span>
      </div>

      <nav class="explore" aria-label="アーカイブを辿る">
        <div class="explore-title">EXPLORE BY</div>

        <div class="explore-links">
          <a href="archive/sound.html">音で辿る</a>
          <a href="archive/photos.html">写真で辿る</a>
          <a href="archive/flowers.html">花で辿る</a>
          <a href="archive/regions.html">地域で辿る</a>
          <a href="archive/memories.html">思い出で辿る</a>
          <a href="archive/seasons.html">季節で辿る</a>
        </div>
      </nav>
    </section>

    <section class="map-area" aria-label="新・花の百名山 地図">
      <div class="map-controls" aria-label="季節で地図を絞り込む">
        <div class="season-filter-title">FILTER BY SEASON</div>

        <div class="filter-buttons">
          <button class="filter-button active" type="button" data-filter="all">ALL</button>
          <button class="filter-button" type="button" data-filter="spring">春</button>
          <button class="filter-button" type="button" data-filter="summer">夏</button>
          <button class="filter-button" type="button" data-filter="autumn">秋</button>
          <button class="filter-button" type="button" data-filter="winter">冬</button>
          <button class="filter-button" type="button" data-filter="visited">訪問済み</button>
        </div>

        <div class="filter-note">
          金色はベストシーズン、淡い金色はその季節でも楽しめる地点。
        </div>
      </div>

      <img src="assets/japan-map.svg" alt="日本地図">

      <div class="map-pins" id="map-pins"></div>

      <div class="place-card" id="place-card" aria-live="polite"></div>
    </section>
  </main>

  <div class="legend">
    <span class="visited">VISITED</span>
    <span>UNVISITED</span>
  </div>

  <script src="data/mountains.js"></script>

  <script>
    const monthBySeason = {
      spring: [3, 4, 5],
      summer: [6, 7, 8],
      autumn: [9, 10, 11],
      winter: [12, 1, 2]
    };

    const pinsContainer = document.getElementById("map-pins");
    const placeCard = document.getElementById("place-card");
    const filterButtons = document.querySelectorAll(".filter-button");
    const visitedCount = document.getElementById("visited-count");

    function monthLabel(months) {
      if (!months || months.length === 0) {
        return "未設定";
      }

      return months
        .slice()
        .sort((a, b) => a - b)
        .map((month) => `${month}月`)
        .join("・");
    }

    function getDisplayName(mountain) {
      return mountain.displayName || mountain.name;
    }

    function hasMapPosition(mountain) {
      return (
        typeof mountain.mapX === "number" &&
        typeof mountain.mapY === "number"
      );
    }

    function getMapPosition(mountain) {
      return {
        left: mountain.mapX,
        top: mountain.mapY
      };
    }

    function isBestSeason(mountain, season) {
      if (season === "all" || season === "visited") {
        return false;
      }

      const months = monthBySeason[season] || [];
      return mountain.bestMonths?.some((month) => months.includes(month));
    }

    function isGoodSeason(mountain, season) {
      if (season === "all" || season === "visited") {
        return false;
      }

      const months = monthBySeason[season] || [];
      return mountain.goodMonths?.some((month) => months.includes(month));
    }

    function shouldShowMountain(mountain, filter) {
      if (filter === "all") {
        return true;
      }

      if (filter === "visited") {
        return mountain.visited;
      }

      return isBestSeason(mountain, filter) || isGoodSeason(mountain, filter);
    }

    function showPlaceCard(mountain) {
      const position = getMapPosition(mountain);
      const cardLeft = Math.min(Math.max(position.left + 2, 8), 68);
      const cardTop = Math.min(Math.max(position.top - 4, 8), 72);

      placeCard.style.left = `${cardLeft}%`;
      placeCard.style.top = `${cardTop}%`;

      const flowers = mountain.flowers?.join(" / ") || "未設定";
      const prefectures = mountain.prefectures?.join("・") || "未設定";
      const bestMonths = monthLabel(mountain.bestMonths);
      const goodMonths = monthLabel(mountain.goodMonths);
      const name = getDisplayName(mountain);

      const linkHtml = mountain.recordUrl
        ? `<a href="${mountain.recordUrl}">VIEW RECORD →</a>`
        : "";

      placeCard.innerHTML = `
        <div class="card-label">NO. ${mountain.no} / ${mountain.region}</div>
        <h2>${name}</h2>
        <p>${mountain.name !== name ? mountain.name : ""}</p>
        <p>${prefectures}</p>
        <p>標高 ${mountain.elevation}m</p>
        <p>花：${flowers}</p>
        <p>BEST：${bestMonths}</p>
        <p>GOOD：${goodMonths}</p>
        ${linkHtml}
      `;

      placeCard.classList.add("visible");
    }

    function hidePlaceCard() {
      placeCard.classList.remove("visible");
    }

    function createPin(mountain) {
      const position = getMapPosition(mountain);
      const pin = document.createElement(mountain.recordUrl ? "a" : "span");

      pin.classList.add("pin");

      if (mountain.visited) {
        pin.classList.add("visited");
      }

      pin.style.left = `${position.left}%`;
      pin.style.top = `${position.top}%`;
      pin.dataset.id = mountain.id;
      pin.setAttribute("aria-label", getDisplayName(mountain));

      if (mountain.recordUrl) {
        pin.href = mountain.recordUrl;
      }

      pin.addEventListener("mouseenter", () => {
        showPlaceCard(mountain);
      });

      pin.addEventListener("focus", () => {
        showPlaceCard(mountain);
      });

      pin.addEventListener("mouseleave", () => {
        hidePlaceCard();
      });

      pin.addEventListener("blur", () => {
        hidePlaceCard();
      });

      return pin;
    }

    function updateFilter(filter) {
      filterButtons.forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === filter);
      });

      const pins = document.querySelectorAll(".pin");
      const visibleMountains = MOUNTAINS.filter(hasMapPosition);

      visibleMountains.forEach((mountain, index) => {
        const pin = pins[index];
        const visible = shouldShowMountain(mountain, filter);

        pin.classList.toggle("hidden", !visible);
        pin.classList.remove("best-season", "good-season");

        if (visible && isBestSeason(mountain, filter)) {
          pin.classList.add("best-season");
        } else if (visible && isGoodSeason(mountain, filter)) {
          pin.classList.add("good-season");
        }
      });

      hidePlaceCard();
    }

    function renderPins() {
      pinsContainer.innerHTML = "";

      MOUNTAINS
        .filter(hasMapPosition)
        .forEach((mountain) => {
          const pin = createPin(mountain);
          pinsContainer.appendChild(pin);
        });

      updateFilter("all");
    }

    function updateVisitedCount() {
      const count = MOUNTAINS.filter((mountain) => mountain.visited).length;
      visitedCount.textContent = count;
    }

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => {
        updateFilter(button.dataset.filter);
      });
    });

    updateVisitedCount();
    renderPins();
  </script>
</body>
</html>
